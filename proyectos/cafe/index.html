<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería web</title>
    <link rel="stylesheet" href="cafe.css">
</head>
<body>
    <header class="cabecera">
        <h1>Cafeteria Lomas</h1>
        <nav class="menu">
            <a href="#">Home</a>
            <a href="#">Productos</a>
            <a href="#">Contacto</a>
        </nav>
    </header>
    <section class="banner">
        <img src="fotos/descarga (1).jpg" alt="Cafe1">

    </section>
    <section class="productos">
        <div class="card">
            <img src="fotos/descarga (2).jpg" alt="">

        <div class="card">
            <img src="fotos/descarga.jpg" alt="">

            <p>3</p>
        </div>

            <img src="fotos/images.jpg" alt="">
            <h3>Capuccino</h3>
            <p>5,5</p>

    <footer class="footer">
        @2026 - Cafetería Lomas
    </footer>
