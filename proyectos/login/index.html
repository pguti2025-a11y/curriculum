<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro</title>
<link rel="stylesheet" href="style/style.css">
</head>
<body>
<div class="container">
<form class="form-box">
<h1>Registro de Usuario</h1>
<div class="input-group">
<div class="input-container">
<img src="img/user.png" class="icon">
<input type="text" placeholder="Nombre de usuario" required>
</div>
<div class="input-container">
<img src="img/email.png" class="icon">
<input type="email" placeholder="Correo Electrónico" required>
</div>
<div class="input-container">
<img src="img/lock.png" class="icon">
<input type="password" placeholder="Contraseña" required>
</div>
</div>
<button type="submit" class="btn">Registro</button>
<p class="footer-text">¿Ya tiene una cuenta? <a href="Login.html">Iniciar sesión</a></p>
</form>
</div>
</body>
</html>
